
<div class="row">
  <h2>Resultados de Predicción</h2>
</div>
<div class="row mt-3">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Título</th>
        <th scope="col">Descripción</th>
        <th scope="col">Resultado</th>
        <th scope="col">Probabilidad Real</th>
        <th scope="col">Probabilidad Fake</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let response of responses; let i = index">
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ response.titulo }}</td>
        <td>{{ response.descripcion }}</td>
        <td>{{ response.resultado === 1 ? 'Real' : 'Fake' }}</td>
        <td>{{ response.probabilidad.real }}</td>
        <td>{{ response.probabilidad.fake }}</td>
      </tr>
    </tbody>
  </table>
</div>
