<app-Navbar></app-Navbar>
<div class="row">
  <div class="col">
    <h2>Agregar Noticias</h2>
  </div>
</div>
<div class="row mt-3 m-3">
  <div class="col">
  
    <form (ngSubmit)="addNews()" #newsForm="ngForm">
      <div class="mt-1">
        <label for="title" class="form-label">Título:</label>
        <input type="text" class="form-control" id="title" name="title" [(ngModel)]="newsTitle" required />
      </div>

      <div class="mt-3">
        <label class="form-label" for="description">Descripción:</label>
        <textarea class="form-control" id="description" name="description" [(ngModel)]="newsDescription" required></textarea>
      </div>
      <button  class="btn btn-light mt-4" type="submit" [disabled]="!newsForm.valid">Agregar Noticia</button>
    </form>
  </div>
</div>

<div class="row mt-5">
  <div class="col">

    <h3>Noticias Agregadas</h3>
    <div>

      <table class="table" style="border-radius: 2em;">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Título</th>
            <th scope="col">Descripción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let news of newsList; let i = index">
            <th scope="row">{{ i + 1 }}</th>
            <td>{{ news.titulo }}</td>
            <td>{{ news.descripcion }}</td>
          </tr>
        </tbody>
      </table>
    
      <button class="btn btn-success" style="background-color: #5B7038; border-color: #5B7038;" (click)="sendNews()" [disabled]="newsList.length === 0">Enviar Noticias</button>
    </div>
  </div>
</div>
